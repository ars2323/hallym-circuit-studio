# v2 Messages 문구(한국어, D-143). 인자는 v1 진단의 인자 그대로다.
# 규칙(v2 지시 7절, N-20): 이름 바로 뒤에 조사를 붙이지 않는다. 이름 뒤에는 부품·포트·회로·터널 같은 낱말이나
# 문장 부호가 온다(DiagTextTest가 틀마다 검사한다). 사실과 위치까지만 말한다.
diag.CLOCK_UNCONNECTED = {0} ({1}) 부품은 클럭 입력 clk 포트가 연결되지 않아 값이 바뀌지 않습니다.
diag.SHORT = {0} 회로의 한 선을 {1} 포트와 {2} 포트가 함께 구동합니다.
diag.WIDTH_MISMATCH = {0} 회로의 한 선에서 비트 폭이 맞지 않습니다: {1} {2}비트 ↔ {3} {4}비트.
diag.INPUT_UNCONNECTED = {0} 부품의 {1} 포트가 연결되지 않았습니다.
diag.INPUT_UNDRIVEN = {0} 포트가 이어진 선에 값을 내는 부품이 없습니다.
diag.TUNNEL_UNPAIRED = {0} 회로에는 {1} 터널과 이름이 같은 다른 터널이 없습니다.
diag.near = 혹시 {0}?
diag.SUBCIRCUIT_PORT_UNCONNECTED = {0} 서브회로의 입력 {1} 포트가 연결되지 않았습니다.
diag.COMBINATIONAL_LOOP = {0} 회로에 조합 루프가 있습니다: {1}.
diag.MEMORY_OVERLAP = {0} 부품과 {1} 부품의 영역이 {2} 구간에서 겹칩니다.
diag.E_APPEARED = 사이클 {0}에 {1} 자리에서 {3} 값이 생겼습니다. {2}
diag.eConflict = E(충돌)
diag.eWidth = E(비트 폭 불일치)
diag.eValue = E(오류)
diag.X_WRITE_DATA = 사이클 {0}에 {1} 부품에 쓸 때 {2} 입력이 정해지지 않아 값이 바뀌지 않았습니다. {3}
diag.X_WRITE_CONTROL = 사이클 {0}에 {1} 부품의 쓰기 입력 {2} 포트가 클럭 에지에서 정해지지 않았습니다. {3}
diag.OSCILLATION = 사이클 {0}에 {1} 회로에서 값이 멈추지 않고 계속 바뀝니다(발진). 고리: {2}. 시뮬레이션이 멈췄습니다.
diag.MIPS_STATUS = 사이클 {0}에 {1}: {2}. {3}
diag.causePrefix = 원인: {0}
diag.cause.COMPONENT = {0} 부품의 입력은 모두 정해졌는데 출력이 {1} 값입니다.
diag.cause.UNDRIVEN = {0} 포트가 이어진 선에 값을 내는 부품이 없습니다.
diag.cause.CONFLICT = {0} 회로의 한 선을 {1} 부품과 {2} 부품이 서로 다른 값으로 구동합니다.
diag.cause.ALL_OFF = {0} 포트가 이어진 선에서 {1} 부품이 모두 값을 내지 않습니다.
diag.cause.INPUT_PIN = {0} 입력 핀의 값이 정해지지 않았습니다.
diag.cause.LOOP = {0} 근처의 고리에서 값이 정해지지 않습니다.
origin.none = 이 선의 값은 정해져 있어 따라갈 E·X 값이 없습니다.
mips.unaligned = Addr 포트의 주소가 워드 정렬이 아닙니다
mips.noRegion = {0} 주소는 어느 메모리 영역에도 없습니다
mips.stackLimit = Stack 사용량이 한계({0})를 넘었습니다
mips.v0Undefined = V0 포트 값이 정해지지 않았습니다
mips.a0Undefined = A0 포트 값이 정해지지 않았습니다
mips.syscall = 지원하지 않는 syscall 번호 {0}입니다
mips.stringNotInMemory = 문자열 주소 {0} 자리가 메모리에 없습니다
mips.undefinedByte = {0} 주소의 바이트가 정해지지 않았습니다
mips.stringTooLong = 문자열이 {0}바이트보다 깁니다
mips.syscallFloating = Syscall 포트가 떠 있습니다
