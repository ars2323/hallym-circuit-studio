# v2 Messages 문구(영어, D-143). 인자는 v1 진단(kr.ac.hallym.hcs.app.diag)의 인자 그대로다.
# 이름(부품·포트·터널·회로)은 학생이 붙인 이름 그대로, 사실과 위치까지만(PLAN.md 4.4).
diag.CLOCK_UNCONNECTED = {0} ({1}): the clock input clk is not connected, so the value never changes.
diag.SHORT = In {0}, one wire is driven by both {1} and {2}.
diag.WIDTH_MISMATCH = In {0}, one wire joins {1} ({2,choice,0#{2} bits|1#{2} bit|1<{2} bits}) and {3} ({4,choice,0#{4} bits|1#{4} bit|1<{4} bits}).
diag.INPUT_UNCONNECTED = {0}: the {1} port is not connected.
diag.INPUT_UNDRIVEN = {0}: connected to a wire that nothing drives.
diag.TUNNEL_UNPAIRED = In {0}, no other tunnel is named {1}.
diag.near = Did you mean {0}?
diag.SUBCIRCUIT_PORT_UNCONNECTED = {0}: subcircuit input port {1} is not connected.
diag.COMBINATIONAL_LOOP = In {0}, there is a combinational loop: {1}.
diag.MEMORY_OVERLAP = The regions of {0} and {1} overlap at {2}.
diag.E_APPEARED = Cycle {0}: {3} appeared at {1}. {2}
diag.eConflict = E (conflicting value)
diag.eWidth = E (error value, bit width mismatch)
diag.eValue = E (error value)
diag.X_WRITE_DATA = Cycle {0}: {1} was written while its input {2} was undefined, so its value did not change. {3}
diag.X_WRITE_CONTROL = Cycle {0}: {1}: the write input {2} was undefined at the clock edge. {3}
diag.OSCILLATION = Cycle {0}: in {1}, values keep changing and never settle (oscillation). Loop: {2}. The simulation stopped.
diag.MIPS_STATUS = Cycle {0}: {1}: {2}. {3}
diag.causePrefix = Cause: {0}
diag.cause.COMPONENT = all inputs of {0} are defined but its output is {1}.
diag.cause.UNDRIVEN = {0}: connected to a wire that nothing drives.
diag.cause.CONFLICT = in {0}, one wire is driven with different values by {1} and {2}.
diag.cause.ALL_OFF = {0}: none of {1} on its wire drives a value.
diag.cause.INPUT_PIN = input pin {0} has no defined value.
diag.cause.LOOP = the value around the loop at {0} is undefined.
# E/X 출처(trace.origin)
origin.none = This wire's value is defined, so there is no E/X to trace.
# MIPS 부품 몸체의 글자(lib-mips)를 v2 문구로(MipsText)
mips.unaligned = Addr not word-aligned
mips.noRegion = {0} is in no memory region
mips.stackLimit = Stack use exceeds its limit ({0})
mips.v0Undefined = V0 undefined
mips.a0Undefined = A0 undefined
mips.syscall = syscall {0} not supported
mips.stringNotInMemory = string address {0} not in memory
mips.undefinedByte = undefined byte at {0}
mips.stringTooLong = string longer than {0}
mips.syscallFloating = Syscall floating
