# 설명 문장(D-049). 문장 안의 메뉴·도구·부품 이름은 names.properties의 영어 이름을 그대로 쓴다.
extSaveError = 회로는 저장했지만 Hallym Circuit Studio 추가 정보(터널 색, 신호 그룹, 영역 메모)를 쓰지 못했습니다: {0}

# 첫 실행 안내(#23)
quickstart.welcome.body = 컴퓨터구조 수업용 회로 편집기입니다. Logisim 2.7.1과 같은 .circ 파일을 열고 저장하므로, 한 파일을 두 프로그램에서 번갈아 써도 됩니다.
quickstart.place.body = 왼쪽 부품 목록에서 부품을 고른 뒤 캔버스를 누르면 놓입니다. 방향과 비트 폭은 오른쪽 Attributes 패널에서 바꿉니다.
quickstart.wire.body = 포트에서 끌면 선이 생깁니다. 선 색은 값을 뜻합니다. 밝은 초록은 1, 어두운 초록은 0, 파랑은 떠 있음, 빨강은 오류, 검정은 여러 비트입니다.
quickstart.poke.body = Poke Tool(손 모양)을 고르고 입력 핀을 누르면 값이 바뀝니다. 파일을 연 직후 값이 x로 보이면 Simulate › Reset Simulation(Ctrl+R)을 누릅니다.
quickstart.mips.body = Hallym MIPS 라이브러리에 Instruction Memory, Data Memory, Stack, Console이 있습니다. Instruction Memory를 오른쪽 클릭하고 "Load .s..."를 고릅니다. 기계어는 Hallym MIPS Simulator와 같습니다.
quickstart.save.body = Ctrl+S로 저장합니다. 원조 Logisim 2.7.1에서도 열립니다. 이 안내는 Help › Getting Started에서 다시 볼 수 있습니다.

# 탭(#68)
tabs.unsaved = 아직 저장하지 않은 파일
tabs.modified = 저장한 뒤 바뀜

# 자동 저장(#70)
autosave.found = Hallym Circuit Studio가 이 파일들을 저장하지 않은 채 닫혔습니다. 마지막 자동 저장이 남아 있습니다:{0}\n\n복구하면 각각 탭으로 열립니다. 저장하기 전에는 원래 파일을 바꾸지 않습니다.

# 스플리터 편집기(#105)
splitter.stripTip = 두 칸 사이 선을 누르면 팔을 나누거나 합칩니다
splitter.badInput = 범위를 읽을 수 없습니다: {0}. 예: 31:26, 25:21, 20:16, 15:0  또는  4x8
splitter.unassigned = 비트 {0}은(는) 어느 팔에도 가지 않습니다.
splitter.mismatch = Arm {0}은(는) {1}비트인데 연결된 선은 {2}비트입니다.
splitter.tooWide = 고른 선의 폭을 모두 더하면 {0}비트입니다. Splitter는 32비트까지입니다.
splitter.combineNeedsOrder = 여러 선을 하나의 버스로 합치려면 Shift+클릭으로 선을 하나씩 고르세요(고른 순서가 비트 순서)
splitter.combineUnknownWidth = 고른 선 중 폭을 아직 모르는 것이 있습니다. 먼저 연결하세요

# 빠른 프로브(#75)
probe.noRoom = 이 선 옆에 빈 자리가 없습니다. 가까운 부품을 조금 옮긴 뒤 다시 해 보세요.

# 조작과 단축키(#78)
keys.nudge = 선택한 것을 한 칸 옮기기
keys.rotate = 선택한 것 돌리기(Shift: 반대로)
keys.duplicate = 선택한 것 복제
keys.delete = 선택한 것 삭제
keys.poke = Edit Tool에서 입력 핀·버튼을 Poke Tool처럼 누르기
keys.value = 입력 핀에서 값 넣기(0x1F, 0b1011, 31, -3), 그 밖의 부품은 라벨 고치기
keys.probe = 선 위에서 Probe 붙이기
keys.zoomWheel = 포인터 중심 확대·축소
keys.zoomStep = 한 단계 확대·축소
keys.zoomFit = 회로 전체 맞춤 / 100%
keys.zoomSel = 선택 부분으로 확대
keys.pan = 화면 이동(가운데 버튼 끌기도)
keys.tools = Toolbar의 도구 고르기
keys.help = 이 표 보기
keys.valuePrompt = {0}({1}비트)에 넣을 값:
keys.badValue = "{0}"을(를) 이 핀에 맞는 값으로 읽을 수 없습니다.

# 찾기와 터널 목록(#80)
keys.find = 모든 서브회로에서 라벨·터널·서브회로 이름 찾기

# 부품 검색과 명령 팔레트(#76)
palette.noImem = 이 회로에 Instruction Memory가 없습니다.
keys.palette = 부품·명령 찾기(Poke Tool, 또는 아무것도 고르지 않은 Edit Tool에서 글자를 쳐도 됨)

# 툴바 그룹과 상태 표시줄(#77)
bar.cyclesPrompt = 클럭 사이클 수:
bar.speed = 실행할 때 클럭 속도
bar.styleNext = 다음에 창을 열 때 Toolbar가 바뀝니다.
bar.legendTip = <html>밝은 초록 1 · 어두운 초록 0 · 파랑 떠 있음 · 빨강 오류 · 주황 폭 불일치 · 검정 여러 비트</html>
bar.simOff = 시뮬레이션이 꺼져 있어 값이 바뀌지 않습니다.
dock.collapse = Attributes 패널 접기
dock.expand = Attributes 패널 펴기
dock.quickTip = 부품을 고르면 그 옆에 자주 바꾸는 속성을 띄웁니다.
quick.editTip = {0}: Enter 적용, Esc 취소
quick.badValue = "{0}"을(를) 이 속성 값으로 읽을 수 없습니다.
keys.label = 라벨 고치기(부품 더블클릭도)
labels.densityTip = 라벨 표시 단계(누를 때마다 바뀝니다). 파일은 바뀌지 않습니다.
keys.redo = 되돌린 것 다시 실행
zoom.tip = 배율(누르면 단계·Fit to Window·Show Grid)
toolbox.searchTip = 입력하면 아래 부품 목록을 거릅니다. Enter로 첫 부품을 고르고, Esc로 지웁니다.
find.expand = 묶음 줄을 누르면 펼치거나 접고, 펼친 자리를 누르면 그곳으로 갑니다.

# 모양 자동 만들기(검토 2차 C)
autoAppearance.impact = 포트 자리가 바뀌어 인스턴스 {0}개에서 연결 {1}곳이 끊어집니다. 계속할까요?

# 정적 진단(2c, PLAN.md 4.2·4.4): 원인 한 곳, 학생이 붙인 이름, 사실과 위치까지만
diag.CLOCK_UNCONNECTED = {0}({1})의 클럭 입력 clk가 연결되지 않아 값이 바뀌지 않습니다.
diag.SHORT = {0}의 한 선을 {1}와(과) {2}이(가) 함께 구동합니다.
diag.WIDTH_MISMATCH = {0}의 한 선에서 비트 폭이 맞지 않습니다: {1} {2}비트 ↔ {3} {4}비트.
diag.INPUT_UNCONNECTED = {0}의 입력 {1}이(가) 연결되지 않았습니다.
diag.INPUT_UNDRIVEN = {0}이(가) 이어진 선에 값을 내는 부품이 없습니다.
diag.TUNNEL_UNPAIRED = {0}에 이름이 {1}인 터널이 하나뿐입니다. 비슷한 이름: {2}
diag.SUBCIRCUIT_PORT_UNCONNECTED = 서브회로 {0}의 입력 포트 {1}이(가) 연결되지 않았습니다.
diag.COMBINATIONAL_LOOP = {0}에 조합 루프가 있습니다: {1}.
