# 첫 실행 안내(#23)
quickstart.title = 시작 안내
quickstart.menu = 시작 안내
quickstart.prev = 이전
quickstart.next = 다음
quickstart.close = 시작하기
quickstart.page = {0} / {1}
quickstart.showAgain = 다음 실행 때도 보이기
quickstart.welcome.title = Hallym Circuit Studio에 오신 것을 환영합니다
quickstart.welcome.body = 컴퓨터구조 수업용 회로 편집기입니다. Logisim 2.7.1과 같은 .circ 파일을 열고 저장하므로, 한 파일을 두 프로그램에서 번갈아 써도 됩니다.
quickstart.place.title = 부품 놓기
quickstart.place.body = 왼쪽 탐색 창에서 부품을 고른 뒤 캔버스를 누르면 놓입니다. 방향과 비트 폭은 탐색 창 아래 속성 표에서 바꿉니다.
quickstart.wire.title = 선 잇기
quickstart.wire.body = 포트에서 끌면 선이 생깁니다. 선 색은 값을 뜻합니다. 밝은 초록은 1, 어두운 초록은 0, 파랑은 떠 있음, 빨강은 오류, 검정은 여러 비트입니다.
quickstart.poke.title = 값 바꿔 보기
quickstart.poke.body = 찌르기 도구(손 모양)를 고르고 입력 핀을 누르면 값이 바뀝니다. 파일을 연 직후 값이 x로 보이면 시뮬레이션 › 시뮬레이션 리셋(Ctrl+R)을 누릅니다.
quickstart.mips.title = MIPS 부품
quickstart.mips.body = Hallym MIPS 라이브러리에 Instruction Memory, Data Memory, Stack, Console이 있습니다. Instruction Memory를 오른쪽 클릭하고 ".s 프로그램 불러오기…"를 고릅니다. 기계어는 Hallym MIPS Simulator와 같습니다.
quickstart.save.title = 저장
quickstart.save.body = Ctrl+S로 저장합니다. 원조 Logisim 2.7.1에서도 열립니다. 이 안내는 도움말 › 시작 안내에서 다시 볼 수 있습니다.

