# 설명 문장(D-049). 문장 안의 메뉴·도구·부품 이름은 names.properties의 영어 이름을 그대로 쓴다.
extSaveError = 회로는 저장했지만 Hallym Circuit Studio 추가 정보(터널 색, 신호 그룹, 영역 메모)를 쓰지 못했습니다: {0}

# 첫 실행 안내(#23)
quickstart.welcome.body = 컴퓨터구조 수업용 회로 편집기입니다. Logisim 2.7.1과 같은 .circ 파일을 열고 저장하므로, 한 파일을 두 프로그램에서 번갈아 써도 됩니다.
quickstart.place.body = 왼쪽 부품 목록에서 부품을 고른 뒤 캔버스를 누르면 놓입니다. 방향과 비트 폭은 오른쪽 Attributes 패널에서 바꿉니다.
quickstart.wire.body = 포트에서 끌면 선이 생깁니다. 선 색은 값을 뜻합니다. 밝은 초록은 1, 어두운 초록은 0, 파랑은 떠 있음, 빨강은 오류, 검정은 여러 비트입니다.
quickstart.poke.body = Poke Tool(손 모양)을 고르고 입력 핀을 누르면 값이 바뀝니다. 파일을 연 직후 값이 x로 보이면 Simulate › Reset Simulation(Ctrl+R)을 누릅니다.
quickstart.mips.body = Hallym MIPS 라이브러리에 Instruction Memory, Data Memory, Stack, Console이 있습니다. Instruction Memory를 오른쪽 클릭하고 "Load .s..."를 고릅니다. 기계어는 Hallym MIPS Simulator와 같습니다.
quickstart.save.body = Ctrl+S로 저장합니다. 원조 Logisim 2.7.1에서도 열립니다. 이 안내는 Help › Getting Started에서 다시 볼 수 있습니다.

