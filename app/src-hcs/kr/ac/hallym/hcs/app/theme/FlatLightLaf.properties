# Hallym Circuit Studio FlatLaf 설정(Z-12b). FlatLaf 설정은 이 파일 한 곳에 모은다.
# 값은 Hallym MIPS v2.3.0 app.css와 같다(docs/design-parity.md). 아래 변수는 Tokens의 같은 이름 값과 같아야 한다
# (FlatLafPropertiesTest). FlatLaf의 arc는 지름이라 CSS 모서리(반지름)의 두 배다.

# ---- Tokens(색) ----
@navy = #00205b
@blue = #0055a5
@gray = #bcbec0
@white = #ffffff
@window = #f5f7fa
@border = #e1e5ea
@hover = #f3f6f9
@text = #1f2933
@text2 = #5a6472
@muted = #65707e
@blueTint = #e8f0f9
@blueTint2 = #d3e2f3
@scroll = #c9d0d8
@scrollHover = #aeb7c2

# ---- 바탕 ----
@accentColor = @blue
@background = @window
@foreground = @text
@disabledForeground = @muted
# 선택: 진파랑 채움 + 흰 글자 대신 옅은 파랑 + navy 글자(Hallym MIPS .ptab.on·.hbtn.on)
@selectionBackground = @blueTint2
@selectionForeground = @navy
@selectionInactiveBackground = @blueTint
@selectionInactiveForeground = @navy
@textSelectionBackground = @blueTint2
@textSelectionForeground = @navy

# ---- 테두리·초점·모서리 ----
Component.borderColor = @border
Component.disabledBorderColor = @border
Component.focusedBorderColor = @blue
Component.focusColor = @blueTint2
Component.focusWidth = 1
# 입력칸·콤보·버튼: 모서리 6px(.btn, .modal input.text)
Component.arc = 12
TextComponent.arc = 12
TextField.background = @white
FormattedTextField.background = @white
TextArea.background = @white
ComboBox.background = @white
Spinner.background = @white

# ---- 단추(.btn 높이 28, 모서리 6, 가로 여백 10). Pretendard 13px 한 줄 + 여백 4·3 + 테두리 = 28 ----
Button.arc = 12
Button.margin = 4,10,3,10
Button.minimumWidth = 0
Button.background = @white
Button.foreground = @navy
Button.borderColor = @border
Button.hoverBackground = @hover
Button.pressedBackground = @blueTint2
Button.default.background = @blue
Button.default.foreground = @white
Button.default.borderColor = @blue
Button.default.hoverBackground = #004a90
Button.default.pressedBackground = @navy
Button.default.focusedBackground = @blue
ToggleButton.selectedBackground = @blueTint2
ToggleButton.selectedForeground = @navy

# ---- 메뉴 ----
MenuBar.background = @white
MenuBar.borderColor = @border
MenuBar.hoverBackground = @blueTint
PopupMenu.background = @white
PopupMenu.borderColor = @border
PopupMenu.borderCornerRadius = 6
Menu.background = @white
MenuItem.background = @white
MenuItem.selectionBackground = @blueTint2
MenuItem.selectionForeground = @navy
Menu.selectionBackground = @blueTint2
Menu.selectionForeground = @navy
MenuItem.acceleratorForeground = @text2
MenuItem.acceleratorSelectionForeground = @navy

# ---- 표·트리·목록(줄 높이 22, --row) ----
Table.rowHeight = 22
Table.background = @white
Table.gridColor = @border
TableHeader.height = 22
TableHeader.background = @white
TableHeader.foreground = @muted
TableHeader.separatorColor = @white
TableHeader.bottomSeparatorColor = @border
Tree.rowHeight = 22
Tree.background = @white
List.background = @white

# ---- 탭(패널 머리 34, .ptab: 가로 10, 밑줄 2 blue, 글자 muted → 고른 탭 navy) ----
TabbedPane.tabHeight = 34
TabbedPane.tabInsets = 0,10,0,10
TabbedPane.underlineColor = @blue
TabbedPane.inactiveUnderlineColor = @gray
TabbedPane.tabSelectionHeight = 2
TabbedPane.selectedBackground = @white
TabbedPane.selectedForeground = @navy
TabbedPane.hoverColor = @hover
TabbedPane.foreground = @muted
TabbedPane.tabSeparatorColor = @border
TabbedPane.contentAreaColor = @border

# ---- 스크롤바(Swing은 직접 그린다: Qt판 값) ----
ScrollBar.width = 12
ScrollBar.showButtons = false
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = @white
ScrollBar.thumb = @scroll
ScrollBar.hoverThumbColor = @scrollHover
ScrollBar.pressedThumbColor = @scrollHover

# ---- 툴팁: navy 바탕 흰 글자(Qt판) ----
ToolTip.background = @navy
ToolTip.foreground = @white
ToolTip.border = 5,8,5,8

# ---- 그 밖 ----
Separator.foreground = @border
SplitPane.background = @window
SplitPaneDivider.draggingColor = @blue
TitlePane.background = @white
TitlePane.foreground = @navy
ProgressBar.foreground = @blue
CheckBox.icon.checkmarkColor = @white
CheckBox.icon.selectedBackground = @blue
CheckBox.icon.selectedBorderColor = @blue
