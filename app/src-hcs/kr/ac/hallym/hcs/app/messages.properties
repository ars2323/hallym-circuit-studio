# 첫 실행 안내(#23)
quickstart.title = Getting Started
quickstart.menu = Getting Started
quickstart.prev = Back
quickstart.next = Next
quickstart.close = Start
quickstart.page = {0} / {1}
quickstart.showAgain = Show at next start
quickstart.welcome.title = Welcome to Hallym Circuit Studio
quickstart.welcome.body = A circuit editor for the Computer Architecture course. It opens and saves the same .circ files as Logisim 2.7.1, so you can keep working on a file in either program.
quickstart.place.title = Place components
quickstart.place.body = Pick a component in the explorer on the left, then click the canvas to place it. Change its direction or bit width in the attribute table below the explorer.
quickstart.wire.title = Connect wires
quickstart.wire.body = Drag from a port to draw a wire. Wires show their value: bright green is 1, dark green is 0, blue is floating, red is an error, and black carries several bits.
quickstart.poke.title = Try values
quickstart.poke.body = Choose the poke tool (the hand) and click an input pin to change its value. If values show as x right after opening a file, choose Simulate › Reset Simulation (Ctrl+R).
quickstart.mips.title = MIPS components
quickstart.mips.body = The Hallym MIPS library has Instruction Memory, Data Memory, Stack and Console. Right-click Instruction Memory and choose "Load .s program…". The machine code is the same as in the Hallym MIPS Simulator.
quickstart.save.title = Save
quickstart.save.body = Save with Ctrl+S. Files open in the original Logisim 2.7.1 too. You can see this guide again from Help › Getting Started.

