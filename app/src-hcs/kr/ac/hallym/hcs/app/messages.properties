# 설명 문장(D-049): 안내·오류·도움말·마우스 오버 설명. 한국어는 messages_ko.properties.
extSaveError = The circuit was saved, but its Hallym Circuit Studio extras (tunnel colors, signal groups, area notes) could not be written: {0}

# 첫 실행 안내(#23)
quickstart.welcome.body = A circuit editor for the Computer Architecture course. It opens and saves the same .circ files as Logisim 2.7.1, so you can keep working on a file in either program.
quickstart.place.body = Pick a component in the list on the left, then click the canvas to place it. Change its direction or bit width in the Attributes panel on the right.
quickstart.wire.body = Drag from a port to draw a wire. Wires show their value: bright green is 1, dark green is 0, blue is floating, red is an error, and black carries several bits.
quickstart.poke.body = Choose the Poke Tool (the hand) and click an input pin to change its value. If values show as x right after opening a file, choose Simulate › Reset Simulation (Ctrl+R).
quickstart.mips.body = The Hallym MIPS library has Instruction Memory, Data Memory, Stack and Console. Right-click Instruction Memory and choose "Load .s...". The machine code is the same as in the Hallym MIPS Simulator.
quickstart.save.body = Save with Ctrl+S. Files open in the original Logisim 2.7.1 too. You can see this guide again from Help › Getting Started.

