name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bison and flex
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison flex
      - name: Checks
        run: tools/ci-local.sh
