name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bison, flex and Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison flex xvfb
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Vendor originals unchanged
        run: tools/verify-vendor.sh
      - name: Identity assets unchanged
        run: tools/verify-assets.sh
      - name: Engine sources match Logisim 2.7.1
        run: tools/check-engine-unchanged.sh
      - name: hcs-asm build and assembly match
        run: make -s -C native/hcs-asm -j"$(nproc)" test
      - name: Gradle build and tests
        run: ./gradlew --no-daemon build
      - name: GUI tests (Xvfb)
        run: xvfb-run -a ./gradlew --no-daemon :app:guiTest
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            lib-mips/build/libs/hcs-mips.jar
            native/hcs-asm/build/hcs-asm

  # hcs-asm.exe: MSYS2 MinGW g++로 정적 링크한다. SPIM 원본 CPU/는 그대로 컴파일한다.
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            make
            bison
            flex
      - name: Build hcs-asm.exe
        run: make -s -C native/hcs-asm -j4 all LDFLAGS=-static
      - name: hcs-asm golden and QtSpim output match
        run: python native/hcs-asm/tests/check.py --no-oracle
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: native/hcs-asm/build/hcs-asm.exe
      # R-01: jpackage로 JRE 포함 zip과 MSI. R-02: 푼 zip의 런타임으로 실제 실행(100%·150%) 뒤 화면을 찍는다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage the app
        shell: pwsh
        run: ./gradlew --no-daemon :app:stage :lib-mips:jar
      - name: Package (zip + MSI)
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { "0.0.0" }
          pwsh tools/package-windows.ps1 -Version $v -Dest dist
      - name: Run the packaged app (tty engine check)
        shell: pwsh
        run: |
          Expand-Archive dist/hallym-circuit-studio-*-windows.zip -DestinationPath smoke
          Get-ChildItem smoke -Recurse -Depth 3 | Select-Object -ExpandProperty FullName
          $jar = (Get-ChildItem smoke -Recurse -Filter hallym-circuit-studio.jar | Select-Object -First 1).FullName
          $java = Get-ChildItem smoke -Recurse -Filter java.exe | Select-Object -First 1
          $java = if ($java) { $java.FullName } else { "java" }  # 포장 런타임에 java.exe가 없으면 JDK의 java로 같은 jar를
          Write-Host "java: $java"; Write-Host "jar: $jar"
          # jpackage의 창 실행 파일은 콘솔에 쓰지 않으므로 java로 같은 jar를 돌린다
          & $java -cp $jar com.cburch.logisim.Main tests/circ/demo-datapath.circ -tty table 2>&1 | Tee-Object -FilePath smoke/tty.txt
          # 원조 -tty table은 머리글 없이 출력 핀 값 줄만 찍는다(halt 핀 → 0/1)
          if (-not (Select-String -Path smoke/tty.txt -Pattern '^[01xE]+\s*$' -Quiet)) { throw "tty output has no value row" }
      - name: Run the packaged app (window, .s, 10 cycles, screenshots at 100% and 150%)
        shell: pwsh
        run: |
          $jar = (Get-ChildItem smoke -Recurse -Filter hallym-circuit-studio.jar | Select-Object -First 1).FullName
          javac -encoding UTF-8 -cp $jar -d smoke/classes tools/winsmoke/Smoke.java
          $java = Get-ChildItem smoke -Recurse -Filter java.exe | Select-Object -First 1
          $java = if ($java) { $java.FullName } else { "java" }
          & $java "-Dsun.java2d.uiScale=1" "-Dhcs.configDir=smoke/config100" "-Djava.util.prefs.userRoot=smoke/prefs100" -cp "$jar;smoke/classes" Smoke tests/circ/demo-datapath.circ tests/mips/sum.s smoke/screenshot-100.png
          if ($LASTEXITCODE -ne 0) { throw "smoke at 100% failed" }
          & $java "-Dsun.java2d.uiScale=1.5" "-Dhcs.configDir=smoke/config150" "-Djava.util.prefs.userRoot=smoke/prefs150" -cp "$jar;smoke/classes" Smoke tests/circ/demo-datapath.circ tests/mips/sum.s smoke/screenshot-150.png
          if ($LASTEXITCODE -ne 0) { throw "smoke at 150% failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: |
            smoke/*.png
            smoke/tty.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.msi

  # R-03: 트랙 A jar가 원조 2.7.1 + Java 8 런타임에서 불러와 도는지(tty로 demo-datapath를 돌린다)
  track-a-java8:
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist-in
      - name: Original 2.7.1 on Java 8 loads hcs-mips.jar and runs demo-datapath
        run: |
          mkdir -p j8 && cp tests/circ/demo-datapath.circ j8/ && cp "$(find dist-in -name hcs-mips.jar | head -1)" j8/
          java -version 2>&1 | head -1
          (cd j8 && timeout 120 java -jar ../vendor/logisim-2.7.1/logisim-generic-2.7.1.jar demo-datapath.circ -tty table | tee tty.txt)
          # 원조 -tty table은 머리글 없이 출력 핀 값 줄만 찍는다(halt 핀 → 0/1). 값 줄이 있으면 jar가 불려 회로가 돈 것이다
          grep -qE '^[01xE]+[[:space:]]*$' j8/tty.txt

  # v* 태그: 트랙 A 배포 zip을 만들어 draft Release에 올린다. 학생 배포는 사용자 결정이라 draft로 둔다.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, track-a-java8]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-in
      - name: Package track A
        run: tools/package-track-a.sh "${GITHUB_REF_NAME#v}" dist-in dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Hallym Circuit Studio $GITHUB_REF_NAME (트랙 A: MIPS 부품 라이브러리)" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.zip dist/hcs-mips.jar dist/hcs-asm dist/hcs-asm.exe dist/hcs-mips-guide-ko.md \
            dist-in/windows-package/*.zip dist-in/windows-package/*.msi
