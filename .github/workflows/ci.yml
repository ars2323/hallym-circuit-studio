name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# D-166: a new push or rebase of a PR cancels its older run; main and tags are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # D-166: the PR gate is linux, electron, runtime (Linux) and track-a-java8. The Windows jobs (setup-exe, setup-e2e,
  # setup-upgrade, runtime on Windows) run on main pushes, v* tags and workflow_dispatch -- and on a PR only when it
  # touches the packaging, the installer, Windows-only code, the engine runtime build or CI itself (the list below).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.decide.outputs.windows }}
      runtime_os: ${{ steps.decide.outputs.runtime_os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Windows jobs on this run?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          windows=true
          if [ "$EVENT" = pull_request ]; then
            windows=false
            changed=$(git diff --name-only "$BASE"...HEAD)
            printf '%s\n' "$changed"
            while IFS= read -r f; do
              case "$f" in
                .github/workflows/*|electron/packaging/*|electron/tools/package*|electron/tools/windows/*|\
                electron/tools/installer-art.py|electron/tools/release-assets.ts|electron/tools/stage-engine.ts|\
                electron/src/main/*|electron/package.json|electron/package-lock.json|\
                engine/build.gradle.kts|gradle/*|tools/package-windows.ps1)
                  echo "Windows jobs: $f"; windows=true ;;
              esac
            done <<< "$changed"
          fi
          if [ "$windows" = true ]; then os='["ubuntu-24.04","windows-2022"]'; else os='["ubuntu-24.04"]'; fi
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "runtime_os=$os" >> "$GITHUB_OUTPUT"
          echo "windows=$windows runtime=$os" | tee -a "$GITHUB_STEP_SUMMARY"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Vendor originals unchanged
        run: tools/verify-vendor.sh
      - name: Identity assets unchanged
        run: tools/verify-assets.sh
      - name: Engine sources match Logisim 2.7.1
        run: tools/check-engine-unchanged.sh
      - name: Fork tree marked against upstream 2.7.1 (D-130)
        run: tools/check-upstream-markers.sh
      # D-141: vendor/spim과 hcs-asm은 지웠다. SPIM 결과(디스어셈블러 골든, 실행 오라클, 메모리 배치)는
      # tests/disasm, tests/spim-oracle 등에 굳혀 두었고 Gradle 테스트가 그 파일과 대조한다.
      - name: Gradle build and tests
        run: ./gradlew --no-daemon build
      # Z-24(D-138): 두 트랙 공용 로더·디스어셈블러와 ProgramLoader의 돌연변이 테스트. 죽인 비율이 95% 아래면 실패한다
      - name: Mutation tests (PIT, loader and disassembler)
        run: ./gradlew --no-daemon :lib-mips:pitest
      # D-129: identity hash가 모두 같은 JVM(-XX:hashCode=2)에서 단위 테스트를 한 번 더 돈다. identityHashCode를
      # 열쇠·서명으로 쓰면(고유하지 않다) 여기서 틀린다. 벽시계 시간을 재는 @Tag("timing")은 뺀다.
      - name: Unit tests with a constant identity hash
        run: ./gradlew --no-daemon :app:testConstantIdentityHash
      - name: Engine server tests (N-03; again with a constant identity hash, D-129)
        run: ./gradlew --no-daemon :engine:test && ./gradlew --no-daemon :engine:test -Phcs.constantHash=true
      # N-06(D-137): 부품 종류 × 대표 속성 조합의 경계·포트와 캔버스 시험 회로를 엔진 API로 다시 만들어 저장소의 것과
      # 한 글자라도 다르면 실패하고, 방금 만든 자료로 렌더러 등록표의 기하 동등성 검사(node)를 돈다
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canvas fixtures regenerate unchanged, geometry parity (N-06)
        run: |
          ./gradlew --no-daemon :engine:canvasFixtures
          git diff --exit-code -- electron/tests/fixtures
          test -z "$(git status --porcelain -- electron/tests/fixtures)"
          node --test electron/tests/unit/canvas-geometry.test.ts
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            lib-mips/build/reports/pitest/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            lib-mips/build/libs/hcs-mips.jar

  # Hallym Circuit Studio 2의 화면(electron/, D-133·D-135). 엔진은 가짜 엔진(electron/tests/fake-engine)으로 시험한다.
  electron:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      # ImageMagick's import reads the X server's pixels: the first screen's video measured on the screen (D-155).
      - name: Install Xvfb and ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb imagemagick
      # Ubuntu 24.04 keeps unprivileged user namespaces from programs without an AppArmor profile: Chromium's sandbox needs them.
      - name: Let Chromium's sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: What is taken from Hallym MIPS is there, copies byte for byte (ORIGIN.md)
        run: node tools/import-hmips.ts --check
      - name: Unit tests
        run: npm test
      - name: Build the window's script
        run: npm run build:ui
      - name: End-to-end tests (Xvfb, the fake engine)
        run: xvfb-run -a -s '-screen 0 2400x1400x24' npx playwright test
      - name: e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e
          path: electron/test-results/

  # N-04(D-142): 엔진만 돌리는 jlink 런타임(Java 21, AppCDS). OS마다 따로 만든다. 크기·시작 시간·메모리를 재서
  # 로그와 요약에 남기고, 그 런타임으로 진짜 엔진 e2e(충돌 뒤 되살리기, 고아 java 없음)를 돌린다.
  runtime:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.runtime_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # D-154: the goldens and specs the tests compare as bytes come out of the checkout as the repository holds
      # them on Windows too (core.autocrlf is on there; .gitattributes -text): every file's bytes hash to its blob.
      - name: Byte-compared goldens and specs checked out byte for byte (.gitattributes -text)
        shell: bash
        run: |
          set -o pipefail
          paths=(tests/hmx tests/parity tests/circ 'tests/mips/*.circ' tests/jarlib electron/tests/fixtures
                 docs/engine-api.md docs/canvas-renderers.md docs/GLOSSARY.md docs/hmx.md)
          git ls-files -s -- "${paths[@]}" | awk '{print $2}' > "$RUNNER_TEMP/blobs"
          git ls-files -- "${paths[@]}" > "$RUNNER_TEMP/paths"
          git hash-object --no-filters --stdin-paths < "$RUNNER_TEMP/paths" > "$RUNNER_TEMP/work"
          echo "$(wc -l < "$RUNNER_TEMP/paths") files"
          paste "$RUNNER_TEMP/paths" "$RUNNER_TEMP/blobs" "$RUNNER_TEMP/work" \
            | awk -F'\t' '$2 != $3 { print "not byte for byte: " $1; bad = 1 } END { exit bad }'
      # The OpenJDK release NOTICE names (engine/build.gradle.kts runtimeJdk; another fails the build)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the engine and its runtime (jlink, AppCDS)
        shell: bash
        run: ./gradlew --no-daemon :engine:stage :engine:runtime :engine:runtimeZip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Measure the engine on the bundled runtime (size, start to engine.hello, memory)
        shell: bash
        working-directory: electron
        run: node tools/engine-measure.ts --runs 5 --json ../engine/build/engine-runtime-measure.json
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Window dependencies
        working-directory: electron
        run: npm ci
      - name: The window with the real engine on the bundled runtime (Linux, all)
        if: runner.os == 'Linux'
        working-directory: electron
        env:
          HCS_E2E_REAL_ENGINE: '1'
        run: |
          npm run build:ui
          HCS_JAVA="$GITHUB_WORKSPACE/engine/build/runtime/bin/java" xvfb-run -a -s '-screen 0 2400x1400x24' npx playwright test real-engine
      # N-22(D-160): the v2 performance goals on the bundled runtime (tools/perf.ts): the start, ref-mips open, pan and zoom
      # at display 100/150 %, N Cycles 1000 with factorial.hmx against v1, Run at 4 kHz. The table in the log and the job
      # summary, engine/build/perf-linux.json in the artifact; fails only over a goal's CI limit (tools/perf-goals.ts).
      - name: Performance goals (Linux, tools/perf.ts)
        if: runner.os == 'Linux'
        working-directory: electron
        run: HCS_JAVA="$GITHUB_WORKSPACE/engine/build/runtime/bin/java" xvfb-run -a -s '-screen 0 2400x1400x24' node tools/perf.ts --runs 3 --json ../engine/build/perf-linux.json
      - name: The window with the real engine on the bundled runtime (Windows, crash recovery and no orphan)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: electron
        env:
          HCS_E2E_REAL_ENGINE: '1'
        run: |
          npm run build:ui
          HCS_JAVA="$GITHUB_WORKSPACE/engine/build/runtime/bin/java.exe" npx playwright test real-engine -g "ended by a crash|killed after edits|no orphan java|the app killed|engine blocked|and leaving"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-runtime-${{ runner.os }}
          path: |
            engine/build/distributions/hcs-runtime-*.zip
            engine/build/engine-runtime-measure.json
            engine/build/perf-linux.json
          if-no-files-found: ignore
      - name: e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-e2e-${{ runner.os }}
          path: electron/test-results/

  # N-23(D-148): Windows 배포물은 setup exe 하나(electron-builder NSIS, 사용자별 원클릭). PR마다 만들어 산출물로 올린다.
  # 엔진 jar 둘과 번들 런타임(N-04)이 들어간다. 설치 검사(setup-e2e, setup-upgrade)와 release가 이 파일을 쓴다.
  # "earlier"는 같은 코드를 1.99.0으로 만든 설치 파일이다(예전 버전 위에 덮어 설치하는 검사용, 배포하지 않음).
  setup-exe:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 코드 서명 없음(D-148)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the engine and its runtime (jlink, AppCDS)
        shell: bash
        run: ./gradlew --no-daemon :engine:stage :engine:runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Window dependencies
        working-directory: electron
        run: npm ci
      - name: Package (the NSIS setup exe)
        working-directory: electron
        run: node tools/package.ts
      - name: The package is one file, the setup exe (no zip, no MSI, no block map)
        working-directory: electron
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip', '.msi', '.7z', '.blockmap', '.appx', '.nupkg' })
          $files | ForEach-Object { '{0}  {1:N1} MB  ({2} bytes)' -f $_.Name, ($_.Length / 1MB), $_.Length }
          if ($files.Count -ne 1 -or $files[0].Name -ne "HallymCircuitStudio-$v-win-x64-setup.exe") {
            throw "expected one file, HallymCircuitStudio-$v-win-x64-setup.exe; got: $($files.Name -join ', ')"
          }
          node tools/release-assets.ts check --version $v $files[0].Name
          if ($LASTEXITCODE -ne 0) { throw 'release-assets' }
          "| setup exe | size |`n|---|---|`n| $($files[0].Name) | $('{0:N1} MB ({1} bytes)' -f ($files[0].Length / 1MB), $files[0].Length) |" >> $env:GITHUB_STEP_SUMMARY
      - name: An earlier version's setup exe (1.99.0, to install over; not released)
        working-directory: electron
        run: node tools/package.ts --version 1.99.0 --out dist-earlier
      - uses: actions/upload-artifact@v4
        with:
          name: HallymCircuitStudio-setup
          path: electron/dist/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HallymCircuitStudio-setup-earlier
          path: electron/dist-earlier/*-setup.exe
          if-no-files-found: error
          retention-days: 3

  # N-23(D-148): 설치 파일을 학생 PC처럼. 조용히 설치 → 설치한 것만 바뀜(설치 폴더, 시작 메뉴 바로 가기, 제거 항목) →
  # 설치한 프로그램을 Playwright로 시작(첫 화면, 번들 런타임의 엔진, MIPS 라이브러리를 쓰는 .circ, 시작 시간) → 끝낸 뒤
  # 레지스트리(HKCU\Software\JavaSoft\Prefs, 프로그램 키)·%APPDATA%·%LOCALAPPDATA%(설치 폴더 밖) 변화 0 → 다시 설치 →
  # 제거하면 아무것도 남지 않음 → 1.99.0 위에 덮어 설치. electron/tools/windows/check-install.ps1, tests/e2e/installed.e2e.ts.
  setup-e2e:
    needs: setup-exe
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Test tools (Playwright; Electron itself is the installed one)
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: HallymCircuitStudio-setup
          path: electron/setup
      - uses: actions/download-artifact@v4
        with:
          name: HallymCircuitStudio-setup-earlier
          path: electron/setup-earlier
      # The runner's other programs write into %APPDATA%, %LOCALAPPDATA% and HKCU at any time: Firefox's
      # default browser agent (a scheduled task) and the Microsoft account service (wlidsvc: a device
      # credential and HKCU\Software\Microsoft\AuthCookies) were seen doing so mid-check.  So do Windows' own
      # scheduled tasks that run in the user's session, each at a time of its own (seen: the device census's
      # Census key) -- what happens once, a control period cannot measure.  Off for the checks, rather than
      # widening what the checks let through (D-148 12); the tasks that still ran are listed at the end.
      # Windows' first-logon work is once too, at fixed times after the runner's user logs on: Explorer's
      # startup-app check (RunNotification, the StartupApp notification settings, WinTrust reset, open-with
      # lists) at logon + 5:02 in each of eight runs, Windows Search's first index of Settings at about
      # logon + 3 min.  The checks start after it: logon + 6.5 min.
      - name: Quiet the runner's other programs (their scheduled tasks, Windows' tasks in the user's session, the Microsoft account service, Windows' first-logon work)
        run: |
          "HCS_CHECKS_FROM=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_ENV
          $tasks = @(Get-ScheduledTask | Where-Object { $_.TaskPath -like '\Mozilla\*' -or $_.TaskName -match 'Firefox|GoogleUpdate|MicrosoftEdgeUpdate|OneDrive' })
          $tasks | ForEach-Object { "disabled: $($_.TaskPath)$($_.TaskName)" }
          $tasks | Disable-ScheduledTask | Out-Null
          $service = '^(SYSTEM|LOCAL SERVICE|NETWORK SERVICE|NT AUTHORITY\\(SYSTEM|LOCAL SERVICE|NETWORK SERVICE)|S-1-5-(18|19|20))$'
          $session = @(Get-ScheduledTask -TaskPath '\Microsoft\Windows\*' | Where-Object { $_.State -ne 'Disabled' -and $_.Principal.UserId -notmatch $service -and ($_.Principal.UserId -or $_.Principal.GroupId -or $_.Principal.LogonType -eq 'Interactive') })
          foreach ($t in $session) {
            try { $t | Disable-ScheduledTask -ErrorAction Stop | Out-Null; "disabled: $($t.TaskPath)$($t.TaskName) (runs as $($t.Principal.UserId)$($t.Principal.GroupId))" }
            catch { "not disabled: $($t.TaskPath)$($t.TaskName) ($($_.Exception.Message.Trim()))" }
          }
          # Disabling does not end an instance already running (seen: WinINet's CacheTask flushing WebCache mid-run): ended too.
          foreach ($t in $session) {
            if ((Get-ScheduledTask -TaskPath $t.TaskPath -TaskName $t.TaskName -ErrorAction SilentlyContinue).State -eq 'Running') {
              try { Stop-ScheduledTask -TaskPath $t.TaskPath -TaskName $t.TaskName -ErrorAction Stop; "ended: $($t.TaskPath)$($t.TaskName)" }
              catch { "not ended: $($t.TaskPath)$($t.TaskName) ($($_.Exception.Message.Trim()))" }
            }
          }
          Get-ScheduledTask | Where-Object State -eq 'Running' | ForEach-Object { "running: $($_.TaskPath)$($_.TaskName)" }
          Get-Process -Name 'firefox', 'default-browser-agent', 'GoogleUpdate', 'MicrosoftEdgeUpdate' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Set-Service -Name wlidsvc -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service -Name wlidsvc -Force -ErrorAction SilentlyContinue
          "wlidsvc: $((Get-Service -Name wlidsvc -ErrorAction SilentlyContinue).Status)"
          $explorer = (Get-Process explorer -ErrorAction SilentlyContinue | Sort-Object StartTime | Select-Object -First 1).StartTime
          $credhist = (Get-Item (Join-Path $env:APPDATA 'Microsoft\Protect\CREDHIST') -Force -ErrorAction SilentlyContinue).LastWriteTime
          $logon = @($explorer, $credhist | Where-Object { $_ }) | Sort-Object | Select-Object -First 1
          "logon: explorer started $explorer, the profile's CREDHIST $credhist; now $(Get-Date)"
          if ($logon) {
            $wait = [int][Math]::Ceiling(($logon.AddSeconds(390) - (Get-Date)).TotalSeconds)
            if ($wait -gt 0) { "Windows' first-logon work: waiting $wait s (until logon + 6.5 min)"; Start-Sleep -Seconds $wait }
          }
          "Explorer's startup-app check done: $(Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\RunNotification')"
          # Subversion's first run: the runner has svn, whose per-user config (%APPDATA%\Subversion) appeared in the middle of
          # the first guided install checked (D-155, not named after this program, nothing of ours runs svn); made here, once,
          # as any first-time work of the runner's other programs is done before the checks (D-148 12).
          if (Get-Command svn -ErrorAction SilentlyContinue) { $null = & svn --version --quiet 2>&1; "Subversion's per-user config: $(Test-Path (Join-Path $env:APPDATA 'Subversion'))" }
          exit 0
      # The students' screen; the start is measured there. Reported either way (report/screen.txt).
      - name: Screen 1920x1080 (tools/windows/screen-1920.ps1)
        continue-on-error: true
        shell: powershell
        run: tools/windows/screen-1920.ps1 -Report report
      - name: Install from nothing (silent, per user)
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          tools/windows/check-install.ps1 -Phase clean -Setup (Get-Item setup/*-setup.exe).FullName -Version $v -Report report
      # cmd, not PowerShell: nothing of the job's own writes into %LOCALAPPDATA% while the program runs
      # (PowerShell saves its startup cache there a while after it starts).
      - name: The installed program (first screen, engine, start time; nothing left after quit)
        timeout-minutes: 15
        shell: cmd
        run: |
          set /p HCS_E2E_EXE=<report\installed.txt
          set HCS_E2E_REPORT=%CD%\report
          node node_modules\@playwright\test\cli.js test installed
      - name: Install again, over itself
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          tools/windows/check-install.ps1 -Phase again -Setup (Get-Item setup/*-setup.exe).FullName -Version $v -Report report
      - name: Uninstall (silent), nothing left
        run: tools/windows/check-install.ps1 -Phase uninstall -Report report
      - name: Over an earlier version (1.99.0), then uninstall
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          tools/windows/check-install.ps1 -Phase over -Older (Get-Item setup-earlier/*-setup.exe).FullName -OlderVersion 1.99.0 -Setup (Get-Item setup/*-setup.exe).FullName -Version $v -Report report
      # D-155: after the checks above, which count what is left on the PC (the screen is read here with PowerShell).
      # The first screen's video as the screen shows it, tinted toward the navy and blurred, at 1920x1080 100/125/150 %
      # (and the still under reduced motion); then pictures of the installed program with its real engine (the first
      # screen, About's engine line, demo-datapath after 1 Cycle): installed silently, measured, uninstalled silently.
      - name: The installed program's first screen on the screen at 100/125/150 %, and its pictures (tests/e2e/windows-start.e2e.ts)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          $p = Start-Process (Get-Item setup/*-setup.exe).FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install: exit $($p.ExitCode)" }
          $env:HCS_E2E_EXE = Join-Path $env:LOCALAPPDATA 'Programs\Hallym Circuit Studio\HallymCircuitStudio.exe'
          $env:HCS_E2E_REPORT = Join-Path (Get-Location) 'report'
          node node_modules/@playwright/test/cli.js test windows-start
          $code = $LASTEXITCODE
          Get-Process HallymCircuitStudio, java -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:LOCALAPPDATA\Programs\Hallym Circuit Studio\*" } | Stop-Process -Force
          $entry =Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like 'Hallym Circuit Studio *' }
          foreach ($e in @($entry)) {
            $exe = [regex]::Match($e.QuietUninstallString, '"([^"]+)"').Groups[1].Value
            $uargs = ($e.QuietUninstallString -replace '"[^"]+"', '').Trim()
            Start-Process $exe -ArgumentList $uargs -Wait
          }
          Start-Sleep -Seconds 5
          exit $code
      # N-22(D-160): the v2 performance goals on the installed program (tools/perf.ts): starts, ref-mips open, pan and zoom
      # at display 100/150 %, N Cycles 1000 with factorial.hmx against v1, Run at 4 kHz, with the checks' sizes
      # (report/install.json) and first start after the install (report/launch.json). Installed silently, measured,
      # uninstalled silently; the table in the job summary, report/perf.json in setup-e2e-report. Frames and Run are
      # report-only here (no GPU on the runner); the rest fails only over its CI limit (tools/perf-goals.ts).
      - name: Performance goals on the installed program (tools/perf.ts)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $p = Start-Process (Get-Item setup/*-setup.exe).FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install: exit $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Hallym Circuit Studio\HallymCircuitStudio.exe'
          node tools/perf.ts --exe $exe --runs 3 --install-json report/install.json --launch-json report/launch.json --json report/perf.json
          $code = $LASTEXITCODE
          Get-Process HallymCircuitStudio, java -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:LOCALAPPDATA\Programs\Hallym Circuit Studio\*" } | Stop-Process -Force
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like 'Hallym Circuit Studio *' }
          foreach ($e in @($entry)) {
            $uexe = [regex]::Match($e.QuietUninstallString, '"([^"]+)"').Groups[1].Value
            $uargs = ($e.QuietUninstallString -replace '"[^"]+"', '').Trim()
            Start-Process $uexe -ArgumentList $uargs -Wait
          }
          Start-Sleep -Seconds 5
          exit $code
      - name: The first screen's background, measured (the job summary)
        if: ${{ !cancelled() }}
        run: |
          if (Test-Path report/backdrop.json) {
            $b = Get-Content report/backdrop.json | ConvertFrom-Json
            $rows = foreach ($k in $b.PSObject.Properties.Name) { $m = $b.$k; "| $k | $('{0:N3}' -f $m.video.towardNavy) / $('{0:N3}' -f $m.video.sharpness) | $('{0:N3}' -f $m.still.towardNavy) / $('{0:N3}' -f $m.still.sharpness) |" }
            @('', '### The installed first screen on the screen (toward navy > 0.4 / sharpness < 0.6)', '', '| scale | video | still (reduced motion) |', '|---|---|---|') + $rows -join "`n" >> $env:GITHUB_STEP_SUMMARY
          }
      # D-155: the installer as a student runs it -- its pages, not /S: the progress (its head, the bar in the app's blue
      # measured on the screen), the finish page (설치가 완료되었습니다, 지금 실행하기 ticked, the navy band with the
      # symbol's plate measured on the screen), 마침 starting the program, then the uninstaller's pages; pictured.
      - name: The installer with its pages (tools/windows/check-installer-ui.ps1)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: tools/windows/check-installer-ui.ps1 -Setup (Get-Item setup/*-setup.exe).FullName -Report report/installer
      # Pictures (every run, so a tag run's and a workflow_dispatch run's are the release's): the installer's progress,
      # finish and uninstaller's pages and the program 마침 started; the installed program with its real engine.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-screens
          path: |
            electron/report/installer/*.png
            electron/report/installer/*.jpg
            electron/report/installed-screens/
          if-no-files-found: warn
      - name: Sizes and times (the job summary)
        if: always()
        run: |
          if ((Test-Path report/install.json) -and (Test-Path report/launch.json)) {
            $i = Get-Content report/install.json | ConvertFrom-Json; $l = Get-Content report/launch.json | ConvertFrom-Json
            $screen = if (Test-Path report/screen.txt) { (Select-String -Path report/screen.txt -Pattern 'RESULT' | Select-Object -Last 1).Line } else { '' }
            $mb = { param($b) '{0:N1} MB' -f ($b / 1MB) }
            @("### Windows setup exe (windows-2022) $screen", '', '| | |', '|---|---|',
              "| setup exe | $(& $mb $i.setupExeBytes) ($($i.setupExeBytes) bytes) |",
              "| installed | $(& $mb $i.installedBytes) in $($i.installedFiles) files (runtime $(& $mb $i.resources.runtime), engine $(& $mb $i.resources.engine), app.asar $(& $mb $i.resources.'app.asar')) |",
              "| silent install | $($i.installMs) ms |",
              "| first start after install: window / first screen / engine ready | $($l.first.windowMs) / $($l.first.startScreenMs) / $($l.first.engineReadyMs) ms |",
              "| second start: window / first screen / engine ready | $($l.second.windowMs) / $($l.second.startScreenMs) / $($l.second.engineReadyMs) ms |") -join "`n" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Scheduled tasks that ran during the checks (report/tasks-run.txt)
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path report | Out-Null
          $from = [DateTime]::Parse($env:HCS_CHECKS_FROM).ToUniversalTime()
          @(Get-ScheduledTask | ForEach-Object {
            $i = $_ | Get-ScheduledTaskInfo -ErrorAction SilentlyContinue
            if ($i -and $i.LastRunTime.ToUniversalTime() -gt $from) { '{0:HH:mm:ss}Z  {1}{2}  (runs as {3}{4})' -f $i.LastRunTime.ToUniversalTime(), $_.TaskPath, $_.TaskName, $_.Principal.UserId, $_.Principal.GroupId }
          } | Sort-Object) | Tee-Object -FilePath report/tasks-run.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-e2e-report
          path: |
            electron/report/
            electron/test-results/
          if-no-files-found: ignore

  # N-23(D-148): 공개 릴리스 v1.0.2의 MSI(1.0.x 사용자별 설치) 위에 setup exe를 조용히 설치하면 MSI가 조용히 지워지고
  # 새 프로그램 하나만 남는다(제거 항목·제품·폴더·바로 가기). 그 프로그램이 돌고, 제거하면 MSI의 흔적까지 남지 않는다.
  setup-upgrade:
    needs: setup-exe
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Test tools (Playwright; Electron itself is the installed one)
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: HallymCircuitStudio-setup
          path: electron/setup
      - name: The v1.0.2 MSI (the public release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.2 --repo $env:GITHUB_REPOSITORY --pattern '*.msi' --dir v1msi
      # The runner's other programs write into %APPDATA%, %LOCALAPPDATA% and HKCU at any time: Firefox's
      # default browser agent (a scheduled task) and the Microsoft account service (wlidsvc: a device
      # credential and HKCU\Software\Microsoft\AuthCookies) were seen doing so mid-check.  So do Windows' own
      # scheduled tasks that run in the user's session, each at a time of its own (seen: the device census's
      # Census key) -- what happens once, a control period cannot measure.  Off for the checks, rather than
      # widening what the checks let through (D-148 12); the tasks that still ran are listed at the end.
      # Windows' first-logon work is once too, at fixed times after the runner's user logs on: Explorer's
      # startup-app check (RunNotification, the StartupApp notification settings, WinTrust reset, open-with
      # lists) at logon + 5:02 in each of eight runs, Windows Search's first index of Settings at about
      # logon + 3 min.  The checks start after it: logon + 6.5 min.
      - name: Quiet the runner's other programs (their scheduled tasks, Windows' tasks in the user's session, the Microsoft account service, Windows' first-logon work)
        run: |
          "HCS_CHECKS_FROM=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_ENV
          $tasks = @(Get-ScheduledTask | Where-Object { $_.TaskPath -like '\Mozilla\*' -or $_.TaskName -match 'Firefox|GoogleUpdate|MicrosoftEdgeUpdate|OneDrive' })
          $tasks | ForEach-Object { "disabled: $($_.TaskPath)$($_.TaskName)" }
          $tasks | Disable-ScheduledTask | Out-Null
          $service = '^(SYSTEM|LOCAL SERVICE|NETWORK SERVICE|NT AUTHORITY\\(SYSTEM|LOCAL SERVICE|NETWORK SERVICE)|S-1-5-(18|19|20))$'
          $session = @(Get-ScheduledTask -TaskPath '\Microsoft\Windows\*' | Where-Object { $_.State -ne 'Disabled' -and $_.Principal.UserId -notmatch $service -and ($_.Principal.UserId -or $_.Principal.GroupId -or $_.Principal.LogonType -eq 'Interactive') })
          foreach ($t in $session) {
            try { $t | Disable-ScheduledTask -ErrorAction Stop | Out-Null; "disabled: $($t.TaskPath)$($t.TaskName) (runs as $($t.Principal.UserId)$($t.Principal.GroupId))" }
            catch { "not disabled: $($t.TaskPath)$($t.TaskName) ($($_.Exception.Message.Trim()))" }
          }
          # Disabling does not end an instance already running (seen: WinINet's CacheTask flushing WebCache mid-run): ended too.
          foreach ($t in $session) {
            if ((Get-ScheduledTask -TaskPath $t.TaskPath -TaskName $t.TaskName -ErrorAction SilentlyContinue).State -eq 'Running') {
              try { Stop-ScheduledTask -TaskPath $t.TaskPath -TaskName $t.TaskName -ErrorAction Stop; "ended: $($t.TaskPath)$($t.TaskName)" }
              catch { "not ended: $($t.TaskPath)$($t.TaskName) ($($_.Exception.Message.Trim()))" }
            }
          }
          Get-ScheduledTask | Where-Object State -eq 'Running' | ForEach-Object { "running: $($_.TaskPath)$($_.TaskName)" }
          Get-Process -Name 'firefox', 'default-browser-agent', 'GoogleUpdate', 'MicrosoftEdgeUpdate' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Set-Service -Name wlidsvc -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service -Name wlidsvc -Force -ErrorAction SilentlyContinue
          "wlidsvc: $((Get-Service -Name wlidsvc -ErrorAction SilentlyContinue).Status)"
          $explorer = (Get-Process explorer -ErrorAction SilentlyContinue | Sort-Object StartTime | Select-Object -First 1).StartTime
          $credhist = (Get-Item (Join-Path $env:APPDATA 'Microsoft\Protect\CREDHIST') -Force -ErrorAction SilentlyContinue).LastWriteTime
          $logon = @($explorer, $credhist | Where-Object { $_ }) | Sort-Object | Select-Object -First 1
          "logon: explorer started $explorer, the profile's CREDHIST $credhist; now $(Get-Date)"
          if ($logon) {
            $wait = [int][Math]::Ceiling(($logon.AddSeconds(390) - (Get-Date)).TotalSeconds)
            if ($wait -gt 0) { "Windows' first-logon work: waiting $wait s (until logon + 6.5 min)"; Start-Sleep -Seconds $wait }
          }
          "Explorer's startup-app check done: $(Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\RunNotification')"
          exit 0
      - name: The v1.0.2 MSI, then the setup exe over it
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          tools/windows/check-install.ps1 -Phase msi -Msi (Get-Item v1msi/*.msi).FullName -Setup (Get-Item setup/*-setup.exe).FullName -Version $v -Report report
      - name: The program runs after the upgrade (first screen, engine; nothing left after quit)
        timeout-minutes: 15
        shell: cmd
        run: |
          set /p HCS_E2E_EXE=<report\installed.txt
          set HCS_E2E_REPORT=%CD%\report
          node node_modules\@playwright\test\cli.js test installed -g "first screen"
      - name: Uninstall (silent), nothing left -- of the MSI either
        run: tools/windows/check-install.ps1 -Phase uninstall -Report report
      - name: Scheduled tasks that ran during the checks (report/tasks-run.txt)
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path report | Out-Null
          $from = [DateTime]::Parse($env:HCS_CHECKS_FROM).ToUniversalTime()
          @(Get-ScheduledTask | ForEach-Object {
            $i = $_ | Get-ScheduledTaskInfo -ErrorAction SilentlyContinue
            if ($i -and $i.LastRunTime.ToUniversalTime() -gt $from) { '{0:HH:mm:ss}Z  {1}{2}  (runs as {3}{4})' -f $i.LastRunTime.ToUniversalTime(), $_.TaskPath, $_.TaskName, $_.Principal.UserId, $_.Principal.GroupId }
          } | Sort-Object) | Tee-Object -FilePath report/tasks-run.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-upgrade-report
          path: |
            electron/report/
            electron/test-results/
          if-no-files-found: ignore

  # R-03: 트랙 A jar가 원조 2.7.1 + Java 8 런타임에서 불러와 도는지(tty로 demo-datapath를 돌린다)
  track-a-java8:
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist-in
      - name: Original 2.7.1 on Java 8 loads hcs-mips.jar and runs demo-datapath
        run: |
          mkdir -p j8 && cp tests/circ/demo-datapath.circ j8/ && cp "$(find dist-in -name hcs-mips.jar | head -1)" j8/
          java -version 2>&1 | head -1
          (cd j8 && timeout 120 java -jar ../vendor/logisim-2.7.1/logisim-generic-2.7.1.jar demo-datapath.circ -tty table | tee tty.txt)
          # 원조 -tty table은 머리글 없이 출력 핀 값 줄만 찍는다(halt 핀 → 0/1). 값 줄이 있으면 jar가 불려 회로가 돈 것이다
          grep -qE '^[01xE]+[[:space:]]*$' j8/tty.txt

  # N-23(D-148): 릴리스. Windows 배포물은 setup exe 하나이고, 함께 올리는 것은 트랙 A(hcs-mips.jar, 트랙 A zip)와
  # 안내 PDF(손으로 올림)뿐이다. 앱 zip(트랙 A 말고)이나 MSI가 끼면 실패한다(electron/tools/release-assets.ts).
  # v* 태그: 태그 = electron/package.json의 버전, 노트 docs/releases/<버전>.md + SHA-256으로 draft를 만든다(-가 든 버전은
  # 사전 릴리스). 게시는 사람이 확인한 뒤 한다(docs/release.md). 태그가 아니면 같은 파일을 모아 규칙만 확인한다.
  release:
    needs: [linux, track-a-java8, setup-exe, setup-e2e, setup-upgrade]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist-in/linux-build
      - uses: actions/download-artifact@v4
        with:
          name: HallymCircuitStudio-setup
          path: dist-in/setup
      - name: The version (a tag's must be electron/package.json's)
        run: |
          pkg=$(node -p "require('./electron/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(node electron/tools/release-assets.ts version "$GITHUB_REF_NAME")
            [ "$version" = "$pkg" ] || { echo "::error::the tag is $GITHUB_REF_NAME but electron/package.json says $pkg"; exit 1; }
          else
            version="$pkg"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version: $version"
      - name: The release's files
        run: |
          tools/package-track-a.sh "$VERSION" dist-in dist-track-a
          mkdir -p release
          cp dist-in/setup/HallymCircuitStudio-*-win-x64-setup.exe release/
          cp dist-track-a/hcs-mips.jar dist-track-a/hcs-mips-*-windows.zip dist-track-a/hcs-mips-*-linux.zip release/
          (cd release && sha256sum -- * | tee ../SHA256SUMS)
      - name: Only the setup exe, track A and guides -- no other zip, no MSI (D-148)
        run: node electron/tools/release-assets.ts check --version "$VERSION" release/*
      - name: Draft release (a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$VERSION.md"
          [ -f "$notes" ] || { echo "::error::no release notes for $VERSION: $notes (from docs/releases/TEMPLATE.md)"; exit 1; }
          {
            cat "$notes"
            printf '\n## SHA-256\n\nCI가 태그 `%s`(커밋 %s)에서 만든 파일입니다. Windows에서 확인: `certutil -hashfile <파일> SHA256`\n\n```\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}"
            cat SHA256SUMS
            printf '```\n'
          } > release-notes.md
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --draft "${pre[@]}" --verify-tag \
            --title "Hallym Circuit Studio $VERSION" --notes-file release-notes.md release/*
          # What the release carries now, by the same rule.
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | node electron/tools/release-assets.ts check --version "$VERSION" -
